<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Drinks · Brisbane crawl planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1A15; --panel:#14261F; --raise:#1D362C; --raise-lit:#27473A;
  --line:#2E5245; --bone:#EFE7D6; --dim:#9DAFA4;
  --amber:#F0A93C; --claret:#C4544D; --brass:#9C8148;
  --r:10px; --pad:16px;
  --display:"Alfa Slab One",Georgia,serif;
  --body:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

.app{display:flex;flex-direction:column;height:100dvh}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.wordmark{font-family:var(--display);font-size:20px;color:var(--bone);line-height:1;white-space:nowrap}
.wordmark span{color:var(--amber)}
.tagline{font-size:12px;color:var(--dim);border-left:1px solid var(--line);padding-left:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.totals{margin-left:auto;display:flex;gap:18px;align-items:baseline}
.total{text-align:right}
.total b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--amber);line-height:1.15}
.total i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

.body{flex:1 1 auto;display:flex;min-height:0}
.maprap{position:relative;flex:1 1 auto;min-width:0;display:flex}
#map{flex:1 1 auto;min-width:0;background:var(--ink)}
.panel{flex:0 0 410px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}

.mapToggle{display:none}
.tabs{display:flex;flex:0 0 auto;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:13px 8px;font-size:12px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--amber)}
.tab .count{display:inline-block;margin-left:6px;background:var(--amber);color:var(--ink);
  border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:0}
.pane{flex:1 1 auto;overflow-y:auto;min-height:0;display:none}
.pane.on{display:block}

input[type=text],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--ink);border:1px solid var(--line);color:var(--bone);
  padding:9px 11px;border-radius:var(--r);font-family:inherit;
  /* 16px minimum stops iOS Safari zooming in on focus, without disabling pinch zoom */
  font-size:16px}
input::placeholder,textarea::placeholder{color:#63756B}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
select{cursor:pointer}

.search{padding:var(--pad);border-bottom:1px solid var(--line);display:grid;gap:10px}
.btn{background:var(--amber);color:#231204;border:0;border-radius:var(--r);padding:10px 16px;
  font-weight:700;font-size:14px;white-space:nowrap;transition:background .15s}
.btn:hover{background:#FFBE5A}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bone);font-weight:500}
.btn.ghost:hover{background:var(--raise)}
.btn.sm{padding:7px 11px;font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--ink);border:1px solid var(--line);color:var(--dim);border-radius:20px;
  padding:5px 12px;font-size:12px;font-weight:500;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--raise-lit);border-color:var(--brass);color:var(--bone)}
.hint{font-size:12px;color:var(--dim);margin:0}

.list{padding:10px var(--pad) 40px}
.result{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:var(--raise);border:1px solid transparent;border-radius:var(--r);
  padding:11px 12px;margin-bottom:7px;transition:border-color .15s,background .15s}
.result:hover{background:var(--raise-lit);border-color:var(--line)}
.result.added{opacity:.5}
.result.added:hover,.result.added:focus-visible{opacity:1}
.plus .rm{display:none}
.result.added:hover .plus,.result.added:focus-visible .plus{
  background:var(--claret);color:#fff;border-color:var(--claret)}
.result.added:hover .plus .ck,.result.added:focus-visible .plus .ck{display:none}
.result.added:hover .plus .rm,.result.added:focus-visible .plus .rm{display:inline}
.result .meta{flex:1;min-width:0}
.result .nm{font-weight:600;font-size:14px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.result .sub{font-size:12px;color:var(--dim);display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.kind{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brass);
  border:1px solid var(--line);border-radius:4px;padding:2px 5px;flex:0 0 auto;margin-top:2px}
.plus{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:var(--ink);color:var(--amber);font-size:19px;display:grid;place-items:center}
.result:hover .plus{background:var(--amber);color:var(--ink);border-color:var(--amber)}

/* crawl header */
.crawlbar{padding:var(--pad);border-bottom:1px solid var(--line);display:grid;gap:9px}
.settings{display:grid;gap:9px}
.settingsToggle{display:none}
.chev{transition:transform .18s;color:var(--dim)}
.crawlbar .row{display:flex;gap:8px}
.crawlbar .row > *{min-width:0}
.lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  display:block;margin-bottom:3px}
.half{flex:1}

/* the spine */
.spine{padding:14px var(--pad) 60px}
.stop{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.stop.over .card{border-color:var(--amber);background:var(--raise-lit)}
.pin{width:44px;height:44px;border-radius:50%;background:var(--amber);color:#231204;
  font-family:var(--display);font-size:19px;display:grid;place-items:center;line-height:1;
  box-shadow:0 0 0 4px rgba(240,169,60,.13)}
.card{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.card .top{display:flex;gap:10px;align-items:center}
.card .meta{flex:1;min-width:0;cursor:pointer}
.card .nm{font-weight:600;font-size:15px;display:block;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmrow{display:flex;align-items:center;gap:8px;min-width:0}
.card .sub{font-size:12px;color:var(--dim);display:block;margin-top:1px}
.acts{display:flex;gap:6px;margin-top:9px}
.act{flex:1;min-height:42px;background:var(--ink);border:1px solid var(--line);color:var(--dim);
  border-radius:var(--r);font-size:12.5px;font-weight:600;display:inline-flex;
  align-items:center;justify-content:center;gap:6px;line-height:1;padding:6px 4px;transition:all .15s}
.gl{display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:11px}
.gl.x{font-size:15px}
.act:hover{background:var(--raise-lit);color:var(--bone);border-color:var(--brass)}
.act:disabled{opacity:.25;cursor:not-allowed;background:var(--ink);color:var(--dim);border-color:var(--line)}
.act.kill:hover{background:rgba(196,84,77,.18);color:#F0B6B2;border-color:var(--claret)}
/* an SVG rather than a text glyph, so the hover highlight sits dead centre on it */
.grip{flex:0 0 auto;display:grid;place-items:center;width:56px;height:52px;
  border-radius:10px;color:var(--brass);transform:translateY(4px);
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.gripdots{display:block;width:12px;height:20px;fill:currentColor}
.grip:hover{background:var(--raise-lit);color:var(--bone)}
.grip:active{cursor:grabbing;background:var(--raise-lit)}
.stop.dragging{opacity:.92}
.stop.dragging .card{border-color:var(--amber);box-shadow:0 8px 24px rgba(0,0,0,.55)}

.ctrls{display:flex;align-items:center;gap:8px;margin-top:10px}
.timechip{flex:0 0 auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--amber);background:var(--ink);border:1px solid var(--line);
  border-radius:20px;padding:3px 10px;white-space:nowrap}
/* both pills share one width and height so they always match exactly */
.stay,.notebtn{flex:0 0 auto;width:116px;min-height:34px;box-sizing:border-box;
  background:var(--ink);border:1px solid var(--line);border-radius:20px;color:var(--dim)}
.stay{display:flex;align-items:center;overflow:hidden;padding:0}
.stay button{flex:0 0 auto;align-self:stretch;background:none;border:0;color:var(--dim);
  padding:0 10px;font-size:15px;line-height:1}
.stay button:hover{background:var(--raise-lit);color:var(--bone)}
.stay span{flex:1 1 auto;min-width:0;font-size:11.5px;font-variant-numeric:tabular-nums;text-align:center}
.notebtn{display:grid;place-items:center;font-size:11.5px;padding:0 8px}
.notebtn:hover{background:var(--raise-lit);color:var(--bone)}
.notebtn.has{border-color:var(--brass);color:var(--brass)}
.card textarea{margin-top:9px}

.leg{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.legline{height:34px;width:0;border-left:2px dashed var(--brass);margin-left:21px;opacity:.75}
.legtxt{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.legtxt b{color:var(--bone);font-weight:600}
.legtxt.approx{color:#6E8175;font-style:italic}

.empty{padding:38px 26px;text-align:center;color:var(--dim)}
.empty h2{font-family:var(--display);font-size:17px;color:var(--bone);margin:0 0 8px;
  font-weight:400;line-height:1.35}
.empty p{margin:0;font-size:13px;line-height:1.6}
.notice{margin:0 var(--pad) 10px;padding:9px 12px;border-radius:var(--r);font-size:12.5px;
  background:var(--raise);border:1px solid var(--line);color:var(--dim)}

.footnote{padding:12px var(--pad);border-top:1px solid var(--line);font-size:10.5px;
  line-height:1.6;color:#63756B;flex:0 0 auto}
.footnote a{color:var(--brass)}

.leaflet-container{background:var(--ink);font-family:var(--body)}
.leaflet-control-attribution{background:rgba(13,26,21,.86)!important;color:#7C8F84!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--brass)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--bone)!important;border-bottom-color:var(--line)!important}
.leaflet-bar a:hover{background:var(--raise-lit)!important}
.numpin{width:32px;height:32px;border-radius:50%;background:var(--amber);color:#231204;
  font-family:var(--display);font-size:15px;display:grid;place-items:center;
  border:2px solid #231204;box-shadow:0 2px 8px rgba(0,0,0,.55)}
.dot{width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--bone);
  box-shadow:0 1px 4px rgba(0,0,0,.5)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--raise);color:var(--bone);border-radius:var(--r)}
.leaflet-popup-content{margin:11px 13px;font-size:13px}
.leaflet-popup-content .pnm{font-weight:700;display:block;margin-bottom:2px}
.leaflet-popup-content .psub{color:var(--dim);font-size:11.5px;display:block;margin-bottom:8px}
.leaflet-popup-content .btn{padding:6px 12px;font-size:12.5px}
.leaflet-popup-close-button{color:var(--dim)!important}
.maptools{position:absolute;z-index:600;left:50%;transform:translateX(-50%);bottom:22px;display:flex;gap:8px}
.maptools .btn{box-shadow:0 4px 16px rgba(0,0,0,.5)}

@media (max-width:860px){
  .body{flex-direction:column}
  .maprap{flex:0 0 40dvh;overflow:hidden;transition:flex-basis .22s ease}
  .app.mapmin .maprap{flex-basis:0}
  .mapToggle{display:flex;flex:0 0 auto;align-items:center;justify-content:center;gap:9px;
    width:100%;background:var(--panel);border:0;border-bottom:1px solid var(--line);
    padding:9px 12px 10px;color:var(--dim);font-size:10.5px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase}
  .grabber{width:34px;height:4px;border-radius:3px;background:var(--line)}
  .mapToggle:active .grabber{background:var(--brass)}
  .panel{flex:1 1 auto;border-right:0;border-top:1px solid var(--line);width:100%}
  .tagline{display:none}
  .topbar{padding:9px 14px;gap:10px}
  .wordmark{font-size:17px}
  .total b{font-size:15px}
  .topbar{flex-wrap:wrap;row-gap:9px}
  .wordmark{flex:1 1 auto}
  .totals{order:3;width:100%;margin-left:0;justify-content:space-between;gap:4px;
    border-top:1px solid var(--line);padding-top:9px}
  .total{flex:1 1 0;text-align:left}
  .total i{font-size:9px;letter-spacing:.08em}
  .maptools{bottom:14px}
  .act{min-height:50px;font-size:13.5px}
  .stay,.notebtn{width:134px;min-height:42px}
  .stay button{font-size:17px;padding:0 12px}
  .stay span{font-size:12.5px}
  .notebtn{font-size:12.5px}
  .grip{width:76px;height:62px;transform:translateY(5px)}
  .gripdots{width:15px;height:25px}
  .timechip{font-size:12.5px;padding:4px 11px}
  .settingsToggle{display:flex;width:100%;align-items:center;justify-content:space-between;
    background:var(--raise);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px;font-weight:600;font-size:14px;color:var(--bone);text-align:left}
  .settingsToggle #settingsLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .settings{display:none}
  .crawlbar.open .settings{display:grid}
  .crawlbar.open .chev{transform:rotate(180deg)}
  .stay button{padding:7px 14px;font-size:15px}
  .notebtn{padding:6px 14px;font-size:13px}
  .plus{width:36px;height:36px}
  .crawlbar{gap:12px}
  .settings{gap:12px}
  .crawlbar .row.split{flex-direction:column;gap:12px}
  .crawlbar .row.split .half{width:100%}
  /* stays at 16px so iOS doesn't zoom on focus; trimmed via padding instead */
  .crawlbar input[type=date],.crawlbar input[type=time]{padding:7px 10px}
  .lbl{margin-bottom:5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="wordmark">LAST <span>DRINKS</span></div>
    <div class="tagline" id="tagline"></div>
    <div class="totals">
      <div class="total"><b id="tStops">0</b><i>stops</i></div>
      <div class="total"><b id="tDist">—</b><i>on foot</i></div>
      <div class="total"><b id="tTime">—</b><i>walking</i></div>
      <div class="total"><b id="tEnd">—</b><i>last drinks</i></div>
    </div>
  </header>

  <div class="body">
    <div class="maprap">
      <div id="map"></div>
      <div class="maptools">
        <button class="btn ghost" id="btnPin">Add a spot</button>
        <button class="btn ghost" id="btnFit">Fit crawl</button>
      </div>
    </div>

    <aside class="panel">
      <button class="mapToggle" id="btnMapToggle" aria-expanded="true" aria-controls="map">
        <span class="grabber"></span>
        <span id="mapToggleLabel">Hide map</span>
      </button>
      <div class="tabs" role="tablist">
        <button class="tab" id="tabFind" role="tab" aria-selected="true">Find venues</button>
        <button class="tab" id="tabCrawl" role="tab" aria-selected="false">The crawl<span class="count" id="tabCount">0</span></button>
      </div>

      <section class="pane on" id="paneFind" role="tabpanel">
        <div class="search">
          <input type="text" id="q" placeholder="Search a venue, or a suburb to jump to" autocomplete="off">
          <div class="chips" id="chips"></div>
          <p class="hint" id="hint"></p>
        </div>
        <div id="findNotice"></div>
        <div class="list" id="results"></div>
      </section>

      <section class="pane" id="paneCrawl" role="tabpanel">
        <div class="crawlbar" id="crawlbar">
          <button class="settingsToggle" id="btnSettings" aria-expanded="false" aria-controls="crawlSettings">
            <span id="settingsLabel">Crawl settings</span><span class="chev">▾</span>
          </button>
          <div class="settings" id="crawlSettings">
          <div class="row">
            <div style="flex:1;min-width:0">
              <label class="lbl" for="crawlPick">Crawl</label>
              <select id="crawlPick"></select>
            </div>
          </div>
          <div class="row">
            <button class="btn ghost sm" id="btnNew">New</button>
            <button class="btn ghost sm" id="btnDupe">Duplicate</button>
            <button class="btn ghost sm" id="btnDel">Delete</button>
          </div>
          <div>
            <label class="lbl" for="crawlName">Name</label>
            <input type="text" id="crawlName" placeholder="Saturday sesh">
          </div>
          <div class="row split">
            <div class="half">
              <label class="lbl" for="crawlDate">Date</label>
              <input type="date" id="crawlDate">
            </div>
            <div class="half">
              <label class="lbl" for="crawlStart">Kick off</label>
              <input type="time" id="crawlStart">
            </div>
          </div>
          </div>
        </div>
        <div id="crawlNotice"></div>
        <div class="spine" id="spine"></div>
      </section>

      <div class="footnote">
        Venue data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>
        contributors under ODbL, extracted <span id="stamp"></span>.
        Basemap © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>.
        Walking routes by <a href="https://routing.openstreetmap.de/about.html" target="_blank" rel="noopener">OSRM / FOSSGIS</a>.
        A venue wrong or missing? <a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener">Fix the map</a>.
      </div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>

const KIND_LABEL = ["Pub","Bar","Club","Brewery","Food"];
const VENUES = RAW.map((r,i) => ({
  id:"osm/"+i, name:r[0], lat:r[1], lon:r[2], kind:r[3],
  address:[r[4],r[5]].filter(Boolean).join(", ")
}));
const HAS_FOOD = VENUES.some(v => v.kind === 4);

const BRISBANE = [-27.4698,153.0251];
const OSRM = "https://routing.openstreetmap.de/routed-foot/route/v1/foot/";
const STORE = "lastdrinks.v3";
const DEFAULT_STAY = 45;

const state = {
  crawls: [], activeId: null,
  route: null, routeKey: null,
  kinds: [true,true,true,true,false],
  query: "", shown: []
};
const $ = id => document.getElementById(id);
const active = () => state.crawls.find(c => c.id === state.activeId);
const stops = () => active()?.stops || [];

/* ---------------- map ---------------- */
const map = L.map("map").setView(BRISBANE,15);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
  maxZoom:19, attribution:"&copy; OpenStreetMap contributors &copy; CARTO"}).addTo(map);
const layerResults = L.layerGroup().addTo(map);
const layerStops   = L.layerGroup().addTo(map);
const layerRoute   = L.layerGroup().addTo(map);

/* ---------------- helpers ---------------- */
const metres = m => m == null ? "—" : (m < 950 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1)+" km");
function mins(s){
  if (s == null) return "—";
  const m = Math.round(s/60);
  return m < 60 ? m+" min" : Math.floor(m/60)+"h "+String(m%60).padStart(2,"0");
}
function clock(totalMin){
  let m = ((Math.round(totalMin) % 1440) + 1440) % 1440;
  const h24 = Math.floor(m/60), mm = String(m%60).padStart(2,"0");
  const ap = h24 < 12 ? "am" : "pm";
  const h = h24 % 12 === 0 ? 12 : h24 % 12;
  return `${h}:${mm} ${ap}`;
}
function haversine(a,b){
  const R=6371000, rad=d=>d*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLon=rad(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const notice = (where,msg) => { $(where).innerHTML = msg ? `<div class="notice">${esc(msg)}</div>` : ""; };
const inCrawl = id => stops().some(v => v.id === id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------------- crawls ---------------- */
function newCrawl(name){
  const now = new Date();
  return { id:uid(), name:name || "Untitled crawl",
    date:new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10),
    start:"19:00", stops:[] };
}
function setActive(id){
  state.activeId = id;
  state.route = null; state.routeKey = null;
  save(); renderCrawlBar(); redraw(); scheduleRoute(); fitAll();
}
function renderCrawlBar(){
  const c = active(); if (!c) return;
  $("crawlPick").innerHTML = state.crawls.map(x =>
    `<option value="${x.id}" ${x.id===c.id?"selected":""}>${esc(x.name)} · ${x.stops.length} stops</option>`).join("");
  $("crawlName").value = c.name;
  $("crawlDate").value = c.date || "";
  $("crawlStart").value = c.start || "19:00";
  $("tagline").textContent = c.name;
  $("settingsLabel").textContent = `${c.name} · ${c.stops.length} ${c.stops.length===1?"stop":"stops"}`;
}

/* ---------------- finding venues ---------------- */
function currentResults(){
  const q = state.query.trim().toLowerCase();
  const pool = VENUES.filter(v => state.kinds[v.kind]);
  if (q) return pool.filter(v => v.name.toLowerCase().includes(q)).slice(0,150);
  const b = map.getBounds();
  return pool.filter(v => b.contains([v.lat,v.lon])).slice(0,150);
}
function drawResults(){
  state.shown = currentResults();
  const q = state.query.trim();
  const list = $("results");
  layerResults.clearLayers();
  $("hint").textContent = q
    ? `Searching all ${VENUES.length} bundled venues by name.`
    : "Showing venues in the current map view. Pan or zoom to explore.";

  if (!state.shown.length){
    list.innerHTML = q
      ? `<div class="empty"><h2>No venue by that name</h2>
         <p>${HAS_FOOD ? "Try switching on the <b>Food &amp; other</b> filter. " : ""}If it still isn't there,
         it may not be in OpenStreetMap yet. Use <b>Add a spot</b> to place it by hand,
         or press Enter to jump the map to a suburb of that name.</p></div>`
      : `<div class="empty"><h2>Nothing in view</h2><p>Zoom out, or search by name above.</p></div>`;
    return;
  }
  list.innerHTML = state.shown.map(v => {
    const added = inCrawl(v.id);
    return `<button class="result ${added?"added":""}"
      ${added?`data-remove="${v.id}" title="Remove from crawl"`:`data-add="${v.id}" title="Add to crawl"`}>
      <span class="meta"><span class="nm">${esc(v.name)}</span>
      <span class="sub">${esc(v.address || "Address not recorded in OpenStreetMap")}</span></span>
      <span class="kind">${KIND_LABEL[v.kind]}</span>
      <span class="plus">${added?'<span class="ck">✓</span><span class="rm">✕</span>':"+"}</span></button>`;
  }).join("");

  state.shown.forEach(v => {
    L.marker([v.lat,v.lon],{icon:L.divIcon({className:"",html:'<div class="dot"></div>',
      iconSize:[13,13],iconAnchor:[7,7]})}).addTo(layerResults)
      .bindPopup(`<span class="pnm">${esc(v.name)}</span>
        <span class="psub">${KIND_LABEL[v.kind]}${v.address?" · "+esc(v.address):""}</span>
        ${inCrawl(v.id)?`<button class="btn ghost" data-rmmap="${v.id}">Remove from crawl</button>`
          :`<button class="btn" data-addmap="${v.id}">Add to crawl</button>`}`);
  });
}
async function jumpTo(q){
  notice("findNotice","Looking up "+q+"…");
  try{
    const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&q="+encodeURIComponent(q));
    const j = await res.json();
    if (!j.length){ notice("findNotice","No place called "+q+" found in Australia."); return; }
    notice("findNotice","");
    $("q").value=""; state.query="";
    map.setView([+j[0].lat,+j[0].lon],16);
    drawResults();
  }catch(e){ notice("findNotice","Place lookup unavailable. Pan the map manually instead."); }
}

/* ---------------- stop operations ---------------- */
function addStop(v){
  if (inCrawl(v.id)) return;
  stops().push({ ...v, notes:"", stay:DEFAULT_STAY });
  afterChange();
}
function removeStop(i){ stops().splice(i,1); afterChange(); }
function removeById(id){
  const i = stops().findIndex(v => v.id === id);
  if (i > -1) removeStop(i);
}
function moveStop(from,to){
  const s = stops();
  if (to < 0 || to >= s.length) return;
  const [v] = s.splice(from,1); s.splice(to,0,v);
  afterChange();
}
function redraw(){ drawResults(); drawSpine(); drawStops(); drawRoute(); updateTotals(); }
function afterChange(){ save(); renderCrawlBar(); redraw(); scheduleRoute(); }

/* ---------------- routing ---------------- */
let routeTimer = null;
function scheduleRoute(){
  clearTimeout(routeTimer);
  if (stops().length < 2){
    state.route=null; state.routeKey=null; layerRoute.clearLayers();
    drawSpine(); updateTotals(); return;
  }
  routeTimer = setTimeout(computeRoute,700);
}
async function computeRoute(){
  const coords = stops().map(v=>`${v.lon.toFixed(6)},${v.lat.toFixed(6)}`).join(";");
  if (coords === state.routeKey) return;
  notice("crawlNotice","Working out the walking route…");
  try{
    const res = await fetch(`${OSRM}${coords}?overview=full&geometries=geojson`);
    const j = await res.json();
    if (j.code !== "Ok" || !j.routes?.length) throw new Error(j.message || "no route");
    const r = j.routes[0];
    state.route = { legs:r.legs.map(l=>({distance:l.distance,duration:l.duration})),
      coords:r.geometry.coordinates.map(c=>[c[1],c[0]]) };
    state.routeKey = coords;
    notice("crawlNotice","");
  }catch(e){
    state.route=null; state.routeKey=null;
    notice("crawlNotice","Couldn't fetch street directions. Showing straight-line estimates instead.");
  }
  drawRoute(); drawSpine(); updateTotals();
}
function legInfo(i){
  if (state.route?.legs?.[i]) return {...state.route.legs[i], approx:false};
  const s = stops(), a = s[i], b = s[i+1];
  if (!a || !b) return null;
  const d = haversine(a,b)*1.3;
  return { distance:d, duration:d/1.35, approx:true };
}

/* ---------------- schedule ---------------- */
function schedule(){
  const c = active(); if (!c) return [];
  const [h,m] = (c.start || "19:00").split(":").map(Number);
  let t = (h||0)*60 + (m||0);
  const out = [];
  c.stops.forEach((s,i) => {
    out.push({ arrive:t, leave:t + (s.stay ?? DEFAULT_STAY) });
    t = out[i].leave;
    const leg = legInfo(i);
    if (leg) t += leg.duration/60;
  });
  return out;
}

/* ---------------- spine ---------------- */
function drawSpine(){
  const el = $("spine"), s = stops(), sch = schedule();
  if (!s.length){
    el.innerHTML = `<div class="empty"><h2>No stops yet</h2>
      <p>Find venues on the map and add them in the order you'll walk them.
      Times, notes and the walking route all fill in automatically.</p></div>`;
    return;
  }
  let html = "";
  s.forEach((v,i) => {
    const stay = v.stay ?? DEFAULT_STAY;
    const hasNote = !!(v.notes && v.notes.trim());
    html += `<div class="stop" data-i="${i}">
      <div class="pin">${i+1}</div>
      <div class="card">
        <div class="top">
          <span class="meta" data-pan="${i}">
            <span class="nmrow">
              <span class="nm">${esc(v.name)}</span>
              <span class="timechip">${clock(sch[i].arrive)}</span>
            </span>
            <span class="sub">${KIND_LABEL[v.kind] || "Spot"}${v.address?" · "+esc(v.address):""}</span>
          </span>
          <span class="grip" data-grip="${i}" title="Drag to reorder" aria-hidden="true"><svg
            class="gripdots" viewBox="0 0 12 20"><circle cx="3" cy="3.5" r="1.6"/><circle cx="9" cy="3.5" r="1.6"/><circle
            cx="3" cy="10" r="1.6"/><circle cx="9" cy="10" r="1.6"/><circle cx="3" cy="16.5" r="1.6"/><circle
            cx="9" cy="16.5" r="1.6"/></svg></span>
        </div>
        <div class="ctrls">
          <span class="stay">
            <button data-stay="${i}" data-d="-15" aria-label="Less time here">−</button>
            <span>${stay} min</span>
            <button data-stay="${i}" data-d="15" aria-label="More time here">+</button>
          </span>
          <button class="notebtn ${hasNote?"has":""}" data-note="${i}">${hasNote?"Notes ✓":"Add notes"}</button>
        </div>
        <div class="acts">
          <button class="act" data-up="${i}" ${i===0?"disabled":""} aria-label="Move ${esc(v.name)} earlier"><span class="gl">▲</span>Earlier</button>
          <button class="act" data-down="${i}" ${i===s.length-1?"disabled":""} aria-label="Move ${esc(v.name)} later"><span class="gl">▼</span>Later</button>
          <button class="act kill" data-del="${i}" aria-label="Remove ${esc(v.name)} from the crawl"><span class="gl x">✕</span>Remove</button>
        </div>
        <textarea data-notes="${i}" placeholder="Dress code, who's meeting you, booking name, drink specials…"
          ${hasNote?"":"hidden"}>${esc(v.notes||"")}</textarea>
      </div>
    </div>`;
    const leg = i < s.length-1 ? legInfo(i) : null;
    if (leg){
      html += `<div class="leg"><div class="legline"></div>
        <div class="legtxt ${leg.approx?"approx":""}">
        <b>${metres(leg.distance)}</b> · ${mins(leg.duration)} walk${leg.approx?" (estimate)":""}
        </div></div>`;
    }
  });
  el.innerHTML = html;
}

/* ---------------- map drawing ---------------- */
function drawStops(){
  layerStops.clearLayers();
  const sch = schedule();
  stops().forEach((v,i) => {
    L.marker([v.lat,v.lon],{zIndexOffset:500,icon:L.divIcon({className:"",
      html:`<div class="numpin">${i+1}</div>`,iconSize:[32,32],iconAnchor:[16,16]})})
      .addTo(layerStops)
      .bindPopup(`<span class="pnm">${i+1}. ${esc(v.name)}</span>
        <span class="psub">${clock(sch[i].arrive)} · ${v.stay ?? DEFAULT_STAY} min</span>
        ${v.notes?`<span class="psub">${esc(v.notes)}</span>`:""}
        <button class="btn ghost" data-rmmap="${v.id}">Remove from crawl</button>`);
  });
}
function drawRoute(){
  layerRoute.clearLayers();
  if (state.route?.coords?.length){
    L.polyline(state.route.coords,{color:"#0D1A15",weight:9,opacity:.85}).addTo(layerRoute);
    L.polyline(state.route.coords,{color:"#F0A93C",weight:4,opacity:.95}).addTo(layerRoute);
  } else if (stops().length > 1){
    L.polyline(stops().map(v=>[v.lat,v.lon]),
      {color:"#9C8148",weight:3,opacity:.6,dashArray:"6 8"}).addTo(layerRoute);
  }
}
function updateTotals(){
  const s = stops(), sch = schedule();
  $("tStops").textContent = s.length;
  $("tabCount").textContent = s.length;
  $("tEnd").textContent = s.length ? clock(sch[s.length-1].leave) : "—";
  if (s.length < 2){ $("tDist").textContent="—"; $("tTime").textContent="—"; return; }
  let d=0,t=0;
  for (let i=0;i<s.length-1;i++){ const l=legInfo(i); if(l){ d+=l.distance; t+=l.duration; } }
  $("tDist").textContent = metres(d);
  $("tTime").textContent = mins(t);
}
function fitAll(){
  const pts = stops().map(v=>[v.lat,v.lon]);
  if (state.route?.coords) pts.push(...state.route.coords);
  if (pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[50,50],maxZoom:17});
}

/* ---------------- persistence ---------------- */
function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({crawls:state.crawls, activeId:state.activeId})); }
  catch(e){}
}
function load(){
  try{
    const j = JSON.parse(localStorage.getItem(STORE) || "null");
    if (j?.crawls?.length){
      state.crawls = j.crawls;
      state.activeId = j.activeId && j.crawls.some(c=>c.id===j.activeId) ? j.activeId : j.crawls[0].id;
      return;
    }
    const old = JSON.parse(localStorage.getItem("lastdrinks.v2") || "null");
    if (old?.crawl?.length){
      const c = newCrawl("Imported crawl");
      c.stops = old.crawl.map(v => ({...v, notes:"", stay:DEFAULT_STAY}));
      state.crawls = [c]; state.activeId = c.id; save(); return;
    }
  }catch(e){}
  const c = newCrawl("My first crawl");
  state.crawls = [c]; state.activeId = c.id;
}

/* ---------------- tabs ---------------- */
function selectTab(which){
  const find = which === "find";
  $("tabFind").setAttribute("aria-selected",find);
  $("tabCrawl").setAttribute("aria-selected",!find);
  $("paneFind").classList.toggle("on",find);
  $("paneCrawl").classList.toggle("on",!find);
}

/* ---------------- events ---------------- */
$("chips").innerHTML = KIND_LABEL.map((l,i) =>
  (i === 4 && !HAS_FOOD) ? "" :
  `<button class="chip" data-k="${i}" aria-pressed="${state.kinds[i]}">${i===4?"Food &amp; other":l+"s"}</button>`
).join("");
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const on = c.getAttribute("aria-pressed") === "true";
  c.setAttribute("aria-pressed", String(!on));
  state.kinds[+c.dataset.k] = !on;
  drawResults();
});

let moveTimer = null;
map.on("moveend", () => {
  if (state.query.trim()) return;
  clearTimeout(moveTimer);
  moveTimer = setTimeout(drawResults,180);
});
$("q").addEventListener("input", e => { state.query = e.target.value; drawResults(); });
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && state.query.trim() && !state.shown.length) jumpTo(state.query.trim());
});
$("tabFind").onclick = () => selectTab("find");
$("tabCrawl").onclick = () => selectTab("crawl");
$("btnFit").onclick = fitAll;

$("results").addEventListener("click", e => {
  const rm = e.target.closest("[data-remove]");
  if (rm){ removeById(rm.dataset.remove); return; }
  const b = e.target.closest("[data-add]"); if (!b) return;
  const v = VENUES.find(x => x.id === b.dataset.add);
  if (v) addStop(v);
});
map.on("popupopen", e => {
  const el = e.popup.getElement(); if (!el) return;
  const add = el.querySelector("[data-addmap]");
  if (add) add.onclick = () => {
    const v = VENUES.find(x => x.id === add.dataset.addmap);
    if (v){ addStop(v); map.closePopup(); }
  };
  const rm = el.querySelector("[data-rmmap]");
  if (rm) rm.onclick = () => { removeById(rm.dataset.rmmap); map.closePopup(); };
});

/* crawl bar */
let savedView = null;
$("btnMapToggle").onclick = () => {
  const app = $("app");
  if (!app.classList.contains("mapmin")) savedView = { c:map.getCenter(), z:map.getZoom() };
  const min = app.classList.toggle("mapmin");
  $("btnMapToggle").setAttribute("aria-expanded", String(!min));
  $("mapToggleLabel").textContent = min ? "Show map" : "Hide map";
  /* Leaflet caches its container size, so a single nudge after the slide isn't
     enough: keep recalculating for the whole animation, then restore the view. */
  const t0 = performance.now();
  (function tick(){
    map.invalidateSize({ animate:false, pan:false });
    if (performance.now() - t0 < 650) requestAnimationFrame(tick);
    else if (!min && savedView){
      map.invalidateSize({ animate:false, pan:false });
      map.setView(savedView.c, savedView.z, { animate:false });
    }
  })();
};
$("btnSettings").onclick = () => {
  const open = $("crawlbar").classList.toggle("open");
  $("btnSettings").setAttribute("aria-expanded", String(open));
};
$("crawlPick").onchange = e => setActive(e.target.value);
$("crawlName").addEventListener("input", e => {
  const c = active(); if (!c) return;
  c.name = e.target.value || "Untitled crawl";
  $("tagline").textContent = c.name;
  const opt = $("crawlPick").selectedOptions[0];
  if (opt) opt.textContent = `${c.name} · ${c.stops.length} stops`;
  $("settingsLabel").textContent = `${c.name} · ${c.stops.length} ${c.stops.length===1?"stop":"stops"}`;
  save();
});
$("crawlDate").addEventListener("change", e => { const c=active(); if(c){ c.date=e.target.value; save(); } });
$("crawlStart").addEventListener("change", e => {
  const c = active(); if (!c) return;
  c.start = e.target.value || "19:00";
  save(); drawSpine(); drawStops(); updateTotals();
});
$("btnNew").onclick = () => {
  const c = newCrawl("Untitled crawl");
  state.crawls.push(c); setActive(c.id); selectTab("crawl");
  $("crawlName").focus(); $("crawlName").select();
};
$("btnDupe").onclick = () => {
  const c = active(); if (!c) return;
  const copy = JSON.parse(JSON.stringify(c));
  copy.id = uid(); copy.name = c.name + " (copy)";
  state.crawls.push(copy); setActive(copy.id);
};
$("btnDel").onclick = () => {
  const c = active(); if (!c) return;
  if (!confirm(`Delete "${c.name}"? This can't be undone.`)) return;
  state.crawls = state.crawls.filter(x => x.id !== c.id);
  if (!state.crawls.length) state.crawls = [newCrawl("My first crawl")];
  setActive(state.crawls[0].id);
};

/* spine interactions */
$("spine").addEventListener("click", e => {
  const t = e.target.closest("button, [data-pan]"); if (!t) return;
  if (t.dataset.del != null) removeStop(+t.dataset.del);
  else if (t.dataset.up != null) moveStop(+t.dataset.up, +t.dataset.up-1);
  else if (t.dataset.down != null) moveStop(+t.dataset.down, +t.dataset.down+1);
  else if (t.dataset.stay != null){
    const v = stops()[+t.dataset.stay];
    v.stay = Math.max(0, Math.min(360, (v.stay ?? DEFAULT_STAY) + (+t.dataset.d)));
    save(); drawSpine(); drawStops(); updateTotals();
  }
  else if (t.dataset.note != null){
    const ta = $("spine").querySelector(`[data-notes="${t.dataset.note}"]`);
    if (ta){ ta.hidden = !ta.hidden; if (!ta.hidden) ta.focus(); }
  }
  else if (t.dataset.pan != null){
    const v = stops()[+t.dataset.pan];
    if (v) map.setView([v.lat,v.lon], Math.max(map.getZoom(),16));
  }
});
/* notes typing must not trigger a redraw, or focus is lost */
$("spine").addEventListener("input", e => {
  const ta = e.target.closest("[data-notes]"); if (!ta) return;
  const v = stops()[+ta.dataset.notes]; if (!v) return;
  v.notes = ta.value;
  const btn = ta.closest(".card").querySelector("[data-note]");
  if (btn){
    const has = !!v.notes.trim();
    btn.classList.toggle("has", has);
    btn.textContent = has ? "Notes ✓" : "Add notes";
  }
  save();
});

/* Reordering. Pointer events rather than HTML5 drag-and-drop, because
   drag-and-drop is not implemented in mobile browsers at all. */
let drag = null;
const crawlPane = $("paneCrawl");
const stopEls = () => [...$("spine").querySelectorAll(".stop")];

$("spine").addEventListener("pointerdown", e => {
  const g = e.target.closest("[data-grip]"); if (!g) return;
  e.preventDefault();
  const el = g.closest(".stop");
  drag = { from:+g.dataset.grip, to:+g.dataset.grip, el, id:e.pointerId };
  el.classList.add("dragging");
  try { g.setPointerCapture(e.pointerId); } catch(err){}
});

$("spine").addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  let best = drag.from, bestD = Infinity;
  const els = stopEls();
  els.forEach(el => {
    el.classList.remove("over");
    const r = el.getBoundingClientRect();
    const d = Math.abs((r.top + r.bottom)/2 - e.clientY);
    if (d < bestD){ bestD = d; best = +el.dataset.i; }
  });
  drag.to = best;
  if (best !== drag.from){
    const t = els.find(el => +el.dataset.i === best);
    if (t) t.classList.add("over");
  }
  const pr = crawlPane.getBoundingClientRect();          // scroll when dragging near an edge
  if (e.clientY < pr.top + 80) crawlPane.scrollTop -= 14;
  else if (e.clientY > pr.bottom - 80) crawlPane.scrollTop += 14;
});

function endDrag(){
  if (!drag) return;
  const { from, to, el } = drag;
  el.classList.remove("dragging");
  stopEls().forEach(x => x.classList.remove("over"));
  drag = null;
  if (from !== to) moveStop(from, to);
}
$("spine").addEventListener("pointerup", endDrag);
$("spine").addEventListener("pointercancel", endDrag);

/* drop a pin for anything OpenStreetMap doesn't know about */
let pinMode = false;
function setPinMode(on){
  pinMode = on;
  $("btnPin").textContent = on ? "Now tap the map" : "Add a spot";
  map.getContainer().style.cursor = on ? "crosshair" : "";
}
$("btnPin").onclick = () => setPinMode(!pinMode);
map.on("click", e => {
  if (!pinMode) return;
  const name = prompt("What's this place called?");
  setPinMode(false);
  if (!name || !name.trim()) return;
  addStop({ id:"manual/"+uid(), name:name.trim(), lat:e.latlng.lat, lon:e.latlng.lng,
    kind:1, address:"Added by hand" });
  selectTab("crawl");
});

/* ---------------- boot ---------------- */
$("stamp").textContent = DATA_STAMP;
load();
renderCrawlBar();
redraw();
if (stops().length){ scheduleRoute(); fitAll(); selectTab("crawl"); }
</script>
</body>
</html>
