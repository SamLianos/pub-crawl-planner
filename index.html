<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Last Drinks · Brisbane crawl planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0D1A15; --panel:#14261F; --raise:#1D362C; --raise-lit:#27473A;
  --line:#2E5245; --bone:#EFE7D6; --dim:#9DAFA4;
  --amber:#F0A93C; --claret:#C4544D; --brass:#9C8148;
  --r:10px; --pad:16px;
  --display:"Alfa Slab One",Georgia,serif;
  --body:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--body);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

.app{display:flex;flex-direction:column;height:100dvh}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.wordmark{font-family:var(--display);font-size:20px;color:var(--bone);line-height:1;white-space:nowrap}
.wordmark span{color:var(--amber)}
.tagline{font-size:12px;color:var(--dim);border-left:1px solid var(--line);padding-left:14px}
.totals{margin-left:auto;display:flex;gap:18px;align-items:baseline}
.total{text-align:right}
.total b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
  color:var(--amber);line-height:1.15}
.total i{font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}

.body{flex:1 1 auto;display:flex;min-height:0}
.maprap{position:relative;flex:1 1 auto;min-width:0;display:flex}
#map{flex:1 1 auto;min-width:0;background:var(--ink)}
.panel{flex:0 0 400px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0}

.tabs{display:flex;flex:0 0 auto;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;padding:13px 8px;font-size:12px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
.tab[aria-selected="true"]{color:var(--bone);border-bottom-color:var(--amber)}
.tab .count{display:inline-block;margin-left:6px;background:var(--amber);color:var(--ink);
  border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:0}
.pane{flex:1 1 auto;overflow-y:auto;min-height:0;display:none}
.pane.on{display:block}

.search{padding:var(--pad);border-bottom:1px solid var(--line);display:grid;gap:10px}
input[type=text]{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--bone);
  padding:10px 12px;border-radius:var(--r);font-family:inherit;font-size:14px}
input[type=text]::placeholder{color:#63756B}
input[type=text]:focus{outline:none;border-color:var(--amber)}
.btn{background:var(--amber);color:#231204;border:0;border-radius:var(--r);padding:10px 16px;
  font-weight:700;font-size:14px;white-space:nowrap;transition:background .15s}
.btn:hover{background:#FFBE5A}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--bone);font-weight:500}
.btn.ghost:hover{background:var(--raise)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--ink);border:1px solid var(--line);color:var(--dim);border-radius:20px;
  padding:5px 12px;font-size:12px;font-weight:500;transition:all .15s}
.chip[aria-pressed="true"]{background:var(--raise-lit);border-color:var(--brass);color:var(--bone)}
.hint{font-size:12px;color:var(--dim);margin:0}
.hint a{color:var(--amber);cursor:pointer;text-decoration:underline}

.list{padding:10px var(--pad) 40px}
.result{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:var(--raise);border:1px solid transparent;border-radius:var(--r);
  padding:11px 12px;margin-bottom:7px;transition:border-color .15s,background .15s}
.result:hover{background:var(--raise-lit);border-color:var(--line)}
.result.added{opacity:.45}
.result .meta{flex:1;min-width:0}
.result .nm{font-weight:600;font-size:14px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.result .sub{font-size:12px;color:var(--dim);display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.kind{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--brass);
  border:1px solid var(--line);border-radius:4px;padding:2px 5px;flex:0 0 auto;margin-top:2px}
.plus{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:var(--ink);color:var(--amber);font-size:19px;display:grid;place-items:center}
.result:hover .plus{background:var(--amber);color:var(--ink);border-color:var(--amber)}

.spine{padding:14px var(--pad) 60px}
.stop{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.stop.drag{opacity:.35}
.stop.over .card{border-color:var(--amber)}
.pin{width:44px;height:44px;border-radius:50%;background:var(--amber);color:#231204;
  font-family:var(--display);font-size:19px;display:grid;place-items:center;line-height:1;
  box-shadow:0 0 0 4px rgba(240,169,60,.13)}
.card{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;display:flex;gap:10px;align-items:flex-start}
.card .meta{flex:1;min-width:0;cursor:pointer}
.card .nm{font-weight:600;font-size:15px;display:block}
.card .sub{font-size:12px;color:var(--dim);display:block;margin-top:1px}
.acts{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.icon{background:none;border:0;color:var(--dim);width:26px;height:22px;display:grid;
  place-items:center;border-radius:5px;font-size:13px;line-height:1}
.icon:hover{background:var(--raise-lit);color:var(--bone)}
.icon.kill:hover{background:rgba(196,84,77,.16);color:var(--claret)}
.icon:disabled{opacity:.22;cursor:not-allowed;background:none}
.grip{cursor:grab;color:var(--brass)}

.leg{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center}
.legline{height:34px;width:0;border-left:2px dashed var(--brass);margin-left:21px;opacity:.75}
.legtxt{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.legtxt b{color:var(--bone);font-weight:600}
.legtxt.approx{color:#6E8175;font-style:italic}

.empty{padding:38px 26px;text-align:center;color:var(--dim)}
.empty h2{font-family:var(--display);font-size:17px;color:var(--bone);margin:0 0 8px;
  font-weight:400;line-height:1.35}
.empty p{margin:0;font-size:13px;line-height:1.6}
.notice{margin:0 var(--pad) 10px;padding:9px 12px;border-radius:var(--r);font-size:12.5px;
  background:var(--raise);border:1px solid var(--line);color:var(--dim)}

.footnote{padding:12px var(--pad);border-top:1px solid var(--line);font-size:10.5px;
  line-height:1.6;color:#63756B;flex:0 0 auto}
.footnote a{color:var(--brass)}

.leaflet-container{background:var(--ink);font-family:var(--body)}
.leaflet-control-attribution{background:rgba(13,26,21,.86)!important;color:#7C8F84!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--brass)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--bone)!important;border-bottom-color:var(--line)!important}
.leaflet-bar a:hover{background:var(--raise-lit)!important}
.numpin{width:32px;height:32px;border-radius:50%;background:var(--amber);color:#231204;
  font-family:var(--display);font-size:15px;display:grid;place-items:center;
  border:2px solid #231204;box-shadow:0 2px 8px rgba(0,0,0,.55)}
.dot{width:13px;height:13px;border-radius:50%;background:var(--panel);border:2px solid var(--bone);
  box-shadow:0 1px 4px rgba(0,0,0,.5)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--raise);color:var(--bone);border-radius:var(--r)}
.leaflet-popup-content{margin:11px 13px;font-size:13px}
.leaflet-popup-content .pnm{font-weight:700;display:block;margin-bottom:2px}
.leaflet-popup-content .psub{color:var(--dim);font-size:11.5px;display:block;margin-bottom:8px}
.leaflet-popup-content .btn{padding:6px 12px;font-size:12.5px}
.leaflet-popup-close-button{color:var(--dim)!important}
.maptools{position:absolute;z-index:600;left:50%;transform:translateX(-50%);bottom:22px;display:flex;gap:8px}
.maptools .btn{box-shadow:0 4px 16px rgba(0,0,0,.5)}

@media (max-width:860px){
  .body{flex-direction:column}
  .maprap{flex:0 0 42dvh}
  .panel{flex:1 1 auto;border-right:0;border-top:1px solid var(--line);width:100%}
  .tagline{display:none}
  .topbar{padding:9px 14px;gap:10px}
  .wordmark{font-size:17px}
  .total b{font-size:15px}
  .maptools{bottom:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="app">
  <header class="topbar">
    <div class="wordmark">LAST <span>DRINKS</span></div>
    <div class="tagline">Brisbane crawl planner</div>
    <div class="totals">
      <div class="total"><b id="tStops">0</b><i>stops</i></div>
      <div class="total"><b id="tDist">—</b><i>on foot</i></div>
      <div class="total"><b id="tTime">—</b><i>walking</i></div>
    </div>
  </header>

  <div class="body">
    <div class="maprap">
      <div id="map"></div>
      <div class="maptools">
        <button class="btn ghost" id="btnPin">Add a spot</button>
        <button class="btn ghost" id="btnFit">Fit crawl</button>
      </div>
    </div>

    <aside class="panel">
      <div class="tabs" role="tablist">
        <button class="tab" id="tabFind" role="tab" aria-selected="true">Find venues</button>
        <button class="tab" id="tabCrawl" role="tab" aria-selected="false">The crawl<span class="count" id="tabCount">0</span></button>
      </div>

      <section class="pane on" id="paneFind" role="tabpanel">
        <div class="search">
          <input type="text" id="q" placeholder="Search a venue, or a suburb to jump to" autocomplete="off">
          <div class="chips" id="chips">
            <button class="chip" data-k="0" aria-pressed="true">Pubs</button>

            <button class="chip" data-k="3" aria-pressed="true">Breweries</button>
          </div>
          <p class="hint" id="hint"></p>
        </div>
        <div id="findNotice"></div>
        <div class="list" id="results"></div>
      </section>

      <section class="pane" id="paneCrawl" role="tabpanel">
        <div id="crawlNotice"></div>
        <div class="spine" id="spine"></div>
      </section>

      <div class="footnote">
        Venue data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>

        Walking routes by <a href="https://routing.openstreetmap.de/about.html" target="_blank" rel="noopener">OSRM / FOSSGIS</a>.
        A venue wrong or missing? <a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener">Fix the map</a>.
      </div>
    </aside>
  </div>
</div>

function haversine(a,b){
  const R = 6371000, rad = d => d*Math.PI/180;
  const dLat = rad(b.lat-a.lat), dLon = rad(b.lon-a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function notice(where,msg){
  $(where).innerHTML = msg ? `<div class="notice">${esc(msg)}</div>` : "";
}
const inCrawl = id => state.crawl.some(v => v.id === id);

/* ---------------- finding venues (all local, instant) ---------------- */
function currentResults(){
  const q = state.query.trim().toLowerCase();
  const pool = VENUES.filter(v => state.kinds[v.kind]);
  if (q) return pool.filter(v => v.name.toLowerCase().includes(q)).slice(0,120);
  const b = map.getBounds();
  return pool.filter(v => b.contains([v.lat, v.lon])).slice(0,120);
}

function drawResults(){
  state.shown = currentResults();
  const q = state.query.trim();
  const list = $("results");
  layerResults.clearLayers();

  $("hint").innerHTML = q
    ? `Searching all ${VENUES.length} Brisbane venues by name.`
    : `Showing venues in the current map view. Pan or zoom to explore.`;

  if (!state.shown.length){
    list.innerHTML = q
      ? `<div class="empty"><h2>No venue by that name</h2>
         <p>It may not be in OpenStreetMap yet. Use <b>Add a spot</b> on the map to place it by hand,
         or press Enter to jump the map to a suburb of that name.</p></div>`
      : `<div class="empty"><h2>Nothing in view</h2>
         <p>Zoom out, or search a venue by name above.</p></div>`;
    return;
  }

  list.innerHTML = state.shown.map(v => {
    const added = inCrawl(v.id);
    return `<button class="result ${added?"added":""}" data-add="${v.id}" ${added?"disabled":""}>
      <span class="meta">
        <span class="nm">${esc(v.name)}</span>
        <span class="sub">${esc(v.address || "Address not recorded in OpenStreetMap")}</span>
      </span>
      <span class="kind">${KIND_LABEL[v.kind]}</span>
      <span class="plus">${added?"✓":"+"}</span>
    </button>`;
  }).join("");

  state.shown.forEach(v => {
    L.marker([v.lat,v.lon], { icon: L.divIcon({ className:"",
      html:'<div class="dot"></div>', iconSize:[13,13], iconAnchor:[7,7] }) })
      .addTo(layerResults)
      .bindPopup(`<span class="pnm">${esc(v.name)}</span>
        <span class="psub">${KIND_LABEL[v.kind]}${v.address ? " · " + esc(v.address) : ""}</span>
        ${inCrawl(v.id) ? '<span class="psub">Already in the crawl</span>'
          : `<button class="btn" data-addmap="${v.id}">Add to crawl</button>`}`);
  });
}

/* suburb jump, only used when a name search finds nothing */
async function jumpTo(q){
  notice("findNotice", "Looking up " + q + "…");
  try {
    const res = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=au&q="
      + encodeURIComponent(q));
    const j = await res.json();
    if (!j.length){ notice("findNotice", "No place called " + q + " found in Australia."); return; }
    notice("findNotice", "");
    $("q").value = ""; state.query = "";
    map.setView([+j[0].lat, +j[0].lon], 16);
    drawResults();
  } catch(e){
    notice("findNotice", "Place lookup unavailable. Pan the map manually instead.");
  }
}

/* ---------------- crawl operations ---------------- */
function addStop(v){ if (!inCrawl(v.id)){ state.crawl.push({...v}); afterChange(); } }
function removeStop(i){ state.crawl.splice(i,1); afterChange(); }
function moveStop(from,to){
  if (to < 0 || to >= state.crawl.length) return;
  const [v] = state.crawl.splice(from,1);
  state.crawl.splice(to,0,v);
  afterChange();
}
function afterChange(){
  save(); drawResults(); drawSpine(); drawStops(); drawRoute(); updateTotals(); scheduleRoute();
}

/* ---------------- routing ---------------- */
let routeTimer = null;
function scheduleRoute(){
  clearTimeout(routeTimer);
  if (state.crawl.length < 2){
    state.route = null; state.routeKey = null;
    layerRoute.clearLayers(); drawSpine(); updateTotals(); return;
  }
  routeTimer = setTimeout(computeRoute, 700);
}
async function computeRoute(){
  const coords = state.crawl.map(v => `${v.lon.toFixed(6)},${v.lat.toFixed(6)}`).join(";");
  if (coords === state.routeKey) return;
  notice("crawlNotice", "Working out the walking route…");
  try {
    const res = await fetch(`${OSRM}${coords}?overview=full&geometries=geojson`);
    const j = await res.json();
    if (j.code !== "Ok" || !j.routes?.length) throw new Error(j.message || "no route");
    const r = j.routes[0];
    state.route = {
      legs: r.legs.map(l => ({ distance:l.distance, duration:l.duration })),
      coords: r.geometry.coordinates.map(c => [c[1],c[0]])
    };
    state.routeKey = coords;
    notice("crawlNotice","");
  } catch(e){
    state.route = null; state.routeKey = null;
    notice("crawlNotice","Couldn't fetch street directions. Showing straight-line estimates instead.");
  }
  drawRoute(); drawSpine(); updateTotals();
}

/* ---------------- crawl spine ---------------- */
function legInfo(i){
  if (state.route?.legs?.[i]) return { ...state.route.legs[i], approx:false };
  const a = state.crawl[i], b = state.crawl[i+1];
  if (!a || !b) return null;
  const d = haversine(a,b)*1.3;
  return { distance:d, duration:d/1.35, approx:true };
}
function drawSpine(){
  const el = $("spine");
  if (!state.crawl.length){
    el.innerHTML = `<div class="empty"><h2>No stops yet</h2>
      <p>Find venues on the map and add them in the order you'll walk them.
      You can shuffle the order at any time.</p></div>`;
    return;
  }
  let html = "";
  state.crawl.forEach((v,i) => {
    html += `<div class="stop" draggable="true" data-i="${i}">
      <div class="pin">${i+1}</div>
      <div class="card">
        <span class="meta" data-pan="${i}">
          <span class="nm">${esc(v.name)}</span>
          <span class="sub">${KIND_LABEL[v.kind]}${v.address ? " · " + esc(v.address) : ""}</span>
        </span>
        <span class="acts">
          <button class="icon grip" aria-hidden="true" tabindex="-1" title="Drag to reorder">⠿</button>
          <button class="icon" data-up="${i}" ${i===0?"disabled":""} aria-label="Move ${esc(v.name)} earlier">▲</button>
          <button class="icon" data-down="${i}" ${i===state.crawl.length-1?"disabled":""} aria-label="Move ${esc(v.name)} later">▼</button>
          <button class="icon kill" data-del="${i}" aria-label="Remove ${esc(v.name)}">✕</button>
        </span>
      </div>
    </div>`;
    const leg = i < state.crawl.length-1 ? legInfo(i) : null;
    if (leg){
      html += `<div class="leg"><div class="legline"></div>
        <div class="legtxt ${leg.approx?"approx":""}">
          <b>${metres(leg.distance)}</b> · ${mins(leg.duration)} walk${leg.approx?" (estimate)":""}
        </div></div>`;
    }
  });
  el.innerHTML = html;
}

/* ---------------- map drawing ---------------- */
function drawStops(){
  layerStops.clearLayers();
  state.crawl.forEach((v,i) => {
    L.marker([v.lat,v.lon], { zIndexOffset:500, icon: L.divIcon({ className:"",
      html:`<div class="numpin">${i+1}</div>`, iconSize:[32,32], iconAnchor:[16,16] }) })
      .addTo(layerStops)
      .bindPopup(`<span class="pnm">${i+1}. ${esc(v.name)}</span>
        <span class="psub">${KIND_LABEL[v.kind]}</span>`);
  });
}
function drawRoute(){
  layerRoute.clearLayers();
  if (state.route?.coords?.length){
    L.polyline(state.route.coords,{color:"#0D1A15",weight:9,opacity:.85}).addTo(layerRoute);
    L.polyline(state.route.coords,{color:"#F0A93C",weight:4,opacity:.95}).addTo(layerRoute);
  } else if (state.crawl.length > 1){
    L.polyline(state.crawl.map(v=>[v.lat,v.lon]),
      {color:"#9C8148",weight:3,opacity:.6,dashArray:"6 8"}).addTo(layerRoute);
  }
}
function updateTotals(){
  $("tStops").textContent = state.crawl.length;
  $("tabCount").textContent = state.crawl.length;
  if (state.crawl.length < 2){ $("tDist").textContent="—"; $("tTime").textContent="—"; return; }
  let d=0,t=0;
  for (let i=0;i<state.crawl.length-1;i++){ const l=legInfo(i); if(l){ d+=l.distance; t+=l.duration; } }
  $("tDist").textContent = metres(d);
  $("tTime").textContent = mins(t);
}
function fitAll(){
  const pts = state.crawl.map(v=>[v.lat,v.lon]);
  if (state.route?.coords) pts.push(...state.route.coords);
  if (pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[50,50],maxZoom:17});
}

/* ---------------- persistence ---------------- */
function save(){ try{ localStorage.setItem(STORE, JSON.stringify({crawl:state.crawl})); }catch(e){} }
function load(){
  try{
    const j = JSON.parse(localStorage.getItem(STORE) || "{}");
    if (Array.isArray(j.crawl)) state.crawl = j.crawl;
  }catch(e){}
}

/* ---------------- tabs ---------------- */
function selectTab(which){
  const find = which === "find";
  $("tabFind").setAttribute("aria-selected", find);
  $("tabCrawl").setAttribute("aria-selected", !find);
  $("paneFind").classList.toggle("on", find);
  $("paneCrawl").classList.toggle("on", !find);
}

/* ---------------- events ---------------- */
let moveTimer = null;
map.on("moveend", () => {
  if (state.query.trim()) return;
  clearTimeout(moveTimer);
  moveTimer = setTimeout(drawResults, 180);
});
$("q").addEventListener("input", e => { state.query = e.target.value; drawResults(); });
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && state.query.trim() && !state.shown.length) jumpTo(state.query.trim());
});
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const on = c.getAttribute("aria-pressed") === "true";
  c.setAttribute("aria-pressed", String(!on));
  state.kinds[+c.dataset.k] = !on;
  drawResults();
});
$("tabFind").onclick = () => selectTab("find");
$("tabCrawl").onclick = () => selectTab("crawl");
$("btnFit").onclick = fitAll;

$("results").addEventListener("click", e => {
  const b = e.target.closest("[data-add]"); if (!b) return;
  const v = VENUES.find(x => x.id === b.dataset.add);
  if (v) addStop(v);
});
map.on("popupopen", e => {
  const btn = e.popup.getElement()?.querySelector("[data-addmap]");
  if (!btn) return;
  btn.onclick = () => {
    const v = VENUES.find(x => x.id === btn.dataset.addmap);
    if (v){ addStop(v); map.closePopup(); }
  };
});
$("spine").addEventListener("click", e => {
  const t = e.target.closest("button, [data-pan]"); if (!t) return;
  if (t.dataset.del != null) removeStop(+t.dataset.del);
  else if (t.dataset.up != null) moveStop(+t.dataset.up, +t.dataset.up-1);
  else if (t.dataset.down != null) moveStop(+t.dataset.down, +t.dataset.down+1);
  else if (t.dataset.pan != null){
    const v = state.crawl[+t.dataset.pan];
    if (v) map.setView([v.lat,v.lon], Math.max(map.getZoom(),16));
  }
});

let dragFrom = null;
$("spine").addEventListener("dragstart", e => {
  const s = e.target.closest(".stop"); if (!s) return;
  dragFrom = +s.dataset.i; s.classList.add("drag");
  e.dataTransfer.effectAllowed = "move";
});
$("spine").addEventListener("dragover", e => {
  const s = e.target.closest(".stop"); if (!s || dragFrom === null) return;
  e.preventDefault();
  document.querySelectorAll(".stop.over").forEach(n => n.classList.remove("over"));
  s.classList.add("over");
});
$("spine").addEventListener("drop", e => {
  const s = e.target.closest(".stop"); if (!s || dragFrom === null) return;
  e.preventDefault(); moveStop(dragFrom, +s.dataset.i); dragFrom = null;
});
$("spine").addEventListener("dragend", () => {
  dragFrom = null;
  document.querySelectorAll(".stop.drag,.stop.over").forEach(n => n.classList.remove("drag","over"));
});

/* drop a pin for anything OpenStreetMap doesn't know about */
let pinMode = false;
function setPinMode(on){
  pinMode = on;
  $("btnPin").textContent = on ? "Now tap the map" : "Add a spot";
  map.getContainer().style.cursor = on ? "crosshair" : "";
}
$("btnPin").onclick = () => setPinMode(!pinMode);
map.on("click", e => {
  if (!pinMode) return;
  const name = prompt("What's this place called?");
  setPinMode(false);
  if (!name || !name.trim()) return;
  addStop({ id:"manual/"+Date.now(), name:name.trim(), lat:e.latlng.lat, lon:e.latlng.lng,
    kind:1, address:"Added by hand" });
  selectTab("crawl");
});

/* ---------------- boot ---------------- */
$("stamp").textContent = DATA_STAMP;
load();
drawResults(); drawSpine(); drawStops(); drawRoute(); updateTotals();
if (state.crawl.length){ scheduleRoute(); fitAll(); selectTab("crawl"); }
</script>
</body>
</html>
